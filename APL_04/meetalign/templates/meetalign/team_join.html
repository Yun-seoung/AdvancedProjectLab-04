{% extends "meetalign/base.html" %}
{% block note %}<li>목업에서 이어받은 화면. 단일 팀을 가정하므로 팀 생성과 초대 코드는 만들지 않는다.</li>{% endblock %}
{% block content %}

  <button>참여</button>
</form>
{% endblock %}
