<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MeetAlign{% endblock %}</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 840px;
         margin: 24px auto; padding: 0 16px; line-height: 1.6; }
  nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  nav form { margin: 0; }
  .note { border: 1px solid #ccc; background: #f7f7f7; padding: 8px 12px; font-size: 13px; }
  .note ul { margin: 4px 0 0 18px; padding: 0; }
  .muted { color: #666; font-size: 13px; }
  .error { color: #b00020; }
  .card { border: 1px solid #ddd; padding: 12px; margin: 12px 0; }
  .minutes { background: #f7f7f7; padding: 12px; white-space: pre-wrap; }
  textarea { width: 100%; box-sizing: border-box; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  .count { font-weight: bold; }
</style>
</head>
<body>
<nav>
  <a href="{% url 'index' %}">MeetAlign</a>
  {% if user.is_authenticated %}
    <span class="muted">{{ user.username }} 님</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>로그아웃</button></form>
  {% else %}
    <a href="{% url 'login' %}">로그인</a>
  {% endif %}
</nav>
<div class="note"><b>설계 결정</b><ul>{% block note %}{% endblock %}</ul></div>
<hr>
{% block content %}{% endblock %}
</body>
</html>
