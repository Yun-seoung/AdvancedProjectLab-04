{% comment %}
시연 흐름 단계 표시. 쓰는 쪽에서 current(1~4)를 넘긴다.
  {% include "meetalign/_stepper.html" with current=1 %}
완료 여부는 이미 context 에 있는 meeting 상태로만 판단한다.
{% endcomment %}
<ol class="stepper">
  <li class="{% if current == 1 %}current{% elif meeting.minutes %}done{% endif %}">
    <span class="num">1</span><span class="label">입력</span>
  </li>
  <li class="{% if current == 2 %}current{% elif meeting.minutes and current > 2 %}done{% endif %}">
    <span class="num">2</span><span class="label">통합 회의록</span>
  </li>
  <li class="{% if current == 3 %}current{% elif meeting.quiz_published and current > 3 %}done{% endif %}">
    <span class="num">3</span><span class="label">확인 문제</span>
  </li>
  <li class="{% if current == 4 %}current{% endif %}">
    <span class="num">4</span><span class="label">결과</span>
  </li>
</ol>
